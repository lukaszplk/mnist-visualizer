[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnist-visualizer"
version = "0.1.0"
description = "MNIST digit recognition with a live neural network training visualizer"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "dearpygui>=1.11",
    "numpy>=1.24",
    "pillow>=9.0",
]
keywords = ["mnist", "neural-network", "visualization", "deep-learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
mnist-visualizer = "mnist_visualizer.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mnist_visualizer"]
